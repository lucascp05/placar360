<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1310">
<title>Placar360 — Central de futebol</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="top"><div class="top-inner">
<a class="brand" href="/" aria-label="Placar360 início"><span class="brand-mark" aria-hidden="true">P</span><span>PLACAR<span class="accent">360</span></span></a>
<span class="top-line"></span><span class="edition">CENTRAL DE FUTEBOL</span>
<div class="top-end"><span id="connection" class="connection"><i></i> Conectando</span><button id="sound" class="icon-button" type="button" aria-label="Ativar som de gol" aria-pressed="false"></button></div>
</div></header>
<main class="workspace">
<aside class="sidebar" aria-label="Navegação por campeonato">
<div class="side-label">EXPLORAR</div>
<button class="side-button selected" data-mode="all"><span data-icon="grid"></span> Todas as partidas</button>
<button class="side-button" data-date-today><span data-icon="calendar"></span> Jogos de hoje</button>
<button class="side-button" data-mode="live"><span data-icon="pulse"></span> Ao vivo <b id="side-live">0</b></button>
<button class="side-button" data-agenda><span data-icon="calendar"></span> Próximos jogos</button>
<button class="side-button" data-mode="favorites"><span data-icon="star"></span> Favoritos</button>
<button class="side-button" data-settings><span data-icon="settings"></span> Configurações</button>
<div class="side-label league-label">CAMPEONATOS</div>
<div id="leagues"></div>
<div class="source-note"><span class="tiny-signal" data-icon="pulse"></span><div><strong id="source-name">Fonte esportiva</strong><small id="source-hint">Aguardando conexão</small></div></div>
</aside>
<section class="scoreboard" aria-labelledby="heading">
<div class="section-header"><div><div class="eyebrow" id="section-label"><span></span> PLACAR DO DIA</div><h1 id="heading">Partidas</h1></div><div id="date-label" class="date-label"></div></div>
<div class="date-panel"><button id="prev" class="icon-button" aria-label="Dia anterior"><span data-icon="left"></span></button><div id="days" class="days"></div><button id="next" class="icon-button" aria-label="Próximo dia"><span data-icon="right"></span></button><label class="calendar" title="Escolher data"><span data-icon="calendar"></span><input id="date" type="date" aria-label="Escolher data"></label></div>
<div class="filters">
<div class="tabs" aria-label="Filtro de partidas"><button data-mode="all" class="selected">Todas</button><button data-mode="live"><i></i> Ao vivo</button><button data-mode="favorites"><span data-icon="star"></span> Favoritos</button></div>
<label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Equipe ou campeonato" aria-label="Buscar equipe ou campeonato"></label>
<select id="league-select" aria-label="Campeonato"><option value="">Todos os campeonatos</option></select>
<div class="tools">
<button class="utility" data-agenda><span data-icon="calendar"></span> Agenda</button>
<button class="utility" data-settings><span data-icon="settings"></span> Configurações</button>
<select id="status-filter" aria-label="Status da partida"><option value="">Qualquer status</option><option value="scheduled">Agendadas</option><option value="final">Encerradas</option><option value="other">Adiados e outros</option></select>
<select id="round-filter" aria-label="Rodada" hidden></select>
</div>
</div>
<p id="calendar-note" class="calendar-note" role="status" hidden></p>
<section id="competition-panel" hidden></section>
<div id="results-meta" class="results-meta"></div>
<div id="matches" aria-live="polite"></div>
</section>
<aside class="feed" aria-labelledby="feed-heading">
<div class="feed-top"><div class="feed-icon" data-icon="pulse"></div><div><div class="eyebrow">TEMPO REAL</div><h2 id="feed-heading">Central de eventos</h2></div></div>
<div id="feed-content"></div>
<div class="feed-footer"><span id="updated">Aguardando dados</span><span id="latency"></span></div>
</aside>
<footer class="footer"><span>PLACAR<span class="accent">360</span></span><span id="attribution"></span><span>Horários de Brasília</span></footer>
</main>
<dialog id="settings">
<form method="dialog">
<h2>Configurações</h2>
<label>Tema <select id="theme"><option value="dark">Escuro</option><option value="light">Claro</option></select></label>
<label>Visualização <select id="density"><option value="normal">Padrão</option><option value="compact">Compacta</option></select></label>
<button class="utility">Concluir</button>
</form>
</dialog>
</body>
</html>
